<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>별자리 챗봇</title>
  <style>
    :root {
      --primary: #ff385c;
      --primary-active: #e00b41;
      --ink: #222222;
      --body: #3f3f3f;
      --muted: #6a6a6a;
      --hairline: #dddddd;
      --surface-soft: #f7f7f7;
      --canvas: #ffffff;
      --shadow: rgba(0, 0, 0, 0.02) 0 0 0 1px, rgba(0, 0, 0, 0.04) 0 2px 6px, rgba(0, 0, 0, 0.1) 0 4px 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Airbnb Cereal VF", Circular, -apple-system, system-ui, Roboto, "Helvetica Neue", sans-serif;
      background: var(--canvas);
      color: var(--ink);
      padding: 24px;
    }
    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      border: 1px solid var(--hairline);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
      background: var(--canvas);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      letter-spacing: -0.02em;
    }
    .subtitle, .status, .note {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .card {
      border: 1px solid var(--hairline);
      border-radius: 14px;
      padding: 18px;
      background: var(--canvas);
    }
    .section-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
    }
    .fields {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    input[type="date"], input[type="password"] {
      width: 100%;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      color: var(--ink);
      background: var(--canvas);
      outline: none;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
    }
    button:hover { background: var(--primary-active); }
    button.secondary {
      color: var(--ink);
      background: var(--canvas);
      border: 1px solid var(--hairline);
    }
    .response {
      margin-top: 14px;
      min-height: 180px;
      white-space: pre-wrap;
      border: 1px solid var(--hairline);
      border-radius: 14px;
      padding: 16px;
      background: var(--surface-soft);
      color: var(--body);
      line-height: 1.6;
    }
    .log {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }
    .log-item {
      border: 1px solid var(--hairline);
      border-radius: 14px;
      background: var(--canvas);
      padding: 12px 14px;
    }
    .log-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .log-text {
      white-space: pre-wrap;
      color: var(--body);
    }
    .warning {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>별자리 챗봇</h1>
        <p class="subtitle">생년월일을 입력하면 별자리에 맞춰 번호를 추천하고, 왜 그 번호를 골랐는지 설명합니다.</p>
      </div>
      <div class="status" id="status">OpenAI API를 서버에서 호출합니다.</div>
    </header>

    <section class="card">
      <h2 class="section-title">입력</h2>
      <div class="fields">
        <label>
          OpenAI API Key
          <input id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label>
          생년월일
          <input id="birthDateInput" type="date" />
        </label>
      </div>

      <div class="buttons">
        <button id="askBtn" type="button">번호 추천받기</button>
        <button id="clearBtn" class="secondary" type="button">기록 지우기</button>
      </div>

      <div class="warning">이 키는 개발용 편의 기능입니다. 공유 PC에서는 사용하지 않는 것이 안전합니다.</div>

      <div class="response" id="response">생년월일과 API 키를 입력하고 버튼을 눌러주세요.</div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const birthDateInput = document.getElementById('birthDateInput');
    const askBtn = document.getElementById('askBtn');
    const clearBtn = document.getElementById('clearBtn');
    const responseEl = document.getElementById('response');
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const API_BASE = 'http://localhost:3000';

    const savedKey = localStorage.getItem('openai_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    function addLog(date, text) {
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<div class="log-label">${date}</div><div class="log-text">${text}</div>`;
      logEl.prepend(item);
    }

    async function ask() {
      const birthDate = birthDateInput.value;
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) {
        responseEl.textContent = 'OpenAI API Key를 먼저 입력해 주세요.';
        return;
      }
      if (!birthDate) {
        responseEl.textContent = '생년월일을 먼저 입력해 주세요.';
        return;
      }

      localStorage.setItem('openai_api_key', apiKey);
      askBtn.disabled = true;
      statusEl.textContent = '추천 번호를 계산 중입니다...';
      responseEl.textContent = '서버에 요청하는 중...';

      try {
        const res = await fetch(`${API_BASE}/api/draw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ birthDate, apiKey }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '요청 실패');
        if (!Array.isArray(data.numbers) || data.numbers.length !== 6 || typeof data.bonus !== 'number') {
          throw new Error('서버 응답 형식이 올바르지 않습니다.');
        }

        const text =
          `별자리: ${data.zodiacKr}\n` +
          `추천 번호: ${data.numbers.join(', ')}\n` +
          `보너스: ${data.bonus}\n\n` +
          `이유:\n${data.explanation}`;

        responseEl.textContent = text;
        addLog(birthDate, text);
        statusEl.textContent = data.mode === 'openai'
          ? 'OpenAI 응답을 받았습니다.'
          : '로컬 fallback으로 응답했습니다.';
      } catch (err) {
        responseEl.textContent = `오류: ${err.message}\n\n서버가 꺼져 있거나, index.html을 직접 열었거나, 포트 3000에 접속이 안 된 상태일 수 있습니다.`;
        statusEl.textContent = '요청에 실패했습니다.';
      } finally {
        askBtn.disabled = false;
      }
    }

    function clearLog() {
      logEl.innerHTML = '';
      responseEl.textContent = '기록을 지웠습니다. 다시 입력해 주세요.';
    }

    askBtn.addEventListener('click', ask);
    clearBtn.addEventListener('click', clearLog);
  </script>
</body>
</html>
