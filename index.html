<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Dash Map Roulette</title>
  <style>
    :root {
      --bg: #060914;
      --panel: rgba(13, 18, 33, 0.92);
      --panel-soft: rgba(18, 25, 44, 0.92);
      --line: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ff385c;
      --gold: #fbbf24;
      --cyan: #38bdf8;
      --shadow: 0 26px 90px rgba(0,0,0,0.58);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,56,92,0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(56,189,248,0.14), transparent 26%),
        linear-gradient(160deg, #050814, #0c1222 60%, #070b14);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .app {
      width: min(1240px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 26px 28px 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(255,56,92,0.11), transparent 34%),
        linear-gradient(225deg, rgba(56,189,248,0.10), transparent 36%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.3rem);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .subtitle {
      margin: 10px 0 0;
      max-width: 900px;
      color: var(--muted);
      line-height: 1.55;
    }

    .content {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      padding: 18px;
    }

    .card {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 800;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 9999px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .chip.active {
      background: rgba(255,56,92,0.18);
      border-color: rgba(255,56,92,0.45);
    }

    .spin-stage {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 14px;
      align-items: stretch;
      margin-bottom: 16px;
    }

    .drop-window {
      position: relative;
      min-height: 480px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(2, 6, 23, 0.74);
      overflow: hidden;
    }

    .drop-track {
      position: absolute;
      inset: -120% 0 auto 0;
      display: grid;
      gap: 14px;
      padding: 16px;
      will-change: transform;
    }

    .lane-title {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.86rem;
      z-index: 2;
      pointer-events: none;
    }

    .spotlight {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      height: 92px;
      border-radius: 22px;
      border: 2px solid rgba(255, 56, 92, 0.65);
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.12);
      pointer-events: none;
      z-index: 2;
    }

    .map-card {
      height: 86px;
      display: grid;
      align-content: center;
      padding: 14px 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,56,92,0.96), rgba(251,191,36,0.94));
      color: #111827;
      font-weight: 900;
      box-shadow: 0 16px 28px rgba(0,0,0,0.25);
    }

    .map-card small {
      display: block;
      margin-top: 4px;
      font-weight: 700;
      opacity: 0.9;
    }

    .sidebox {
      display: grid;
      gap: 12px;
    }

    .result {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      padding: 16px;
    }

    .result-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .result-name {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .result-meta {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.55;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 9999px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #111827;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.22);
    }

    button.secondary {
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: 560px;
      overflow: auto;
      padding-right: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 88px 1fr 88px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
    }

    .rank {
      font-weight: 900;
    }

    .mapname {
      font-weight: 700;
    }

    .mode {
      text-align: right;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .spin {
      animation: spinPulse 0.5s linear infinite;
    }

    @keyframes spinPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.14); }
    }

    @media (max-width: 960px) {
      .content, .spin-stage { grid-template-columns: 1fr; }
      .drop-window { min-height: 360px; }
      .spotlight { height: 80px; }
      .row { grid-template-columns: 1fr; }
      .mode { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Geometry Dash Map Roulette</h1>
      <p class="subtitle">
        맵이 위에서 아래로 떨어지는 잭팟형 룰렛입니다. AREDL을 기준으로 이지데몬, 미데, 하데, 익데, 레거시, 익텐, Top10을 고를 수 있고,
        가능하면 실제 사이트 데이터를 가져오며, 실패하면 자동 fallback으로 돌아갑니다.
      </p>
    </section>

    <section class="content">
      <div class="card">
        <h2 class="section-title">룰렛</h2>
        <div class="controls" id="modeButtons"></div>

        <div class="spin-stage">
          <div class="drop-window" id="dropWindow">
            <div class="lane-title">
              <span>TOP</span>
              <span id="statusText">READY</span>
              <span>BOTTOM</span>
            </div>
            <div class="spotlight"></div>
            <div class="drop-track" id="dropTrack"></div>
          </div>

          <div class="sidebox">
            <div class="result">
              <div class="result-label">선택 모드</div>
              <div class="result-name" id="selectedMode">이지데몬</div>
              <div class="result-meta" id="selectedMeta">구간 버튼을 눌러 시작하세요.</div>
            </div>
            <div class="buttons">
              <button id="spinBtn" type="button">SPIN</button>
              <button id="turboBtn" type="button">TURBO</button>
              <button id="resetBtn" class="secondary" type="button">리셋</button>
            </div>
            <div class="result">
              <div class="result-label">당첨 맵</div>
              <div class="result-name" id="resultName">-</div>
              <div class="result-meta" id="resultMeta">룰렛을 돌리면 여기에 결과가 나옵니다.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">맵 풀</h2>
        <div class="list" id="mapList"></div>
      </div>
    </section>
  </main>

  <script>
    const modes = [
      {
        id: 'easy',
        label: '이지데몬',
        meta: 'easydemonlist.pages.dev의 실제 목록',
        endpoint: 'https://easydemonlist.pages.dev/',
        fetcher: 'easy',
        pool: [],
      },
      {
        id: 'mid',
        label: '미데',
        meta: 'mediumdemonslist.pages.dev의 실제 목록',
        endpoint: 'https://mediumdemonslist.pages.dev/',
        fetcher: 'medium',
        pool: [],
      },
      {
        id: 'hard',
        label: '하데',
        meta: 'harddemonslist.pages.dev의 실제 목록',
        endpoint: 'https://harddemonslist.pages.dev/',
        fetcher: 'hard',
        pool: [],
      },
      {
        id: 'exo',
        label: '익데',
        meta: 'Extreme Demon 전체',
        endpoint: 'https://aredl.net/?showToast=authRequired',
        fetcher: 'aredl',
        pool: [
          { name: 'Arcturus', rank: 1 },
          { name: 'Tidal Wave', rank: 2 },
          { name: 'Kyouki', rank: 3 },
          { name: 'Acheron', rank: 4 },
          { name: 'Tartarus', rank: 5 },
          { name: 'Bloodlust', rank: 10 },
          { name: 'the super hotdog', rank: 1497 },
        ],
      },
      {
        id: 'legacy',
        label: '레거시',
        meta: 'AREDL 150등 이하',
        endpoint: 'https://aredl.net/?showToast=authRequired',
        fetcher: 'aredl',
        pool: [
          { name: 'Legacy Slot A', rank: 149 },
          { name: 'Legacy Slot B', rank: 143 },
          { name: 'Legacy Slot C', rank: 132 },
          { name: 'Legacy Slot D', rank: 117 },
          { name: 'Legacy Slot E', rank: 98 },
          { name: 'Legacy Slot F', rank: 151 },
        ],
      },
      {
        id: 'extended',
        label: '익텐',
        meta: 'AREDL 76~150',
        endpoint: 'https://aredl.net/?showToast=authRequired',
        fetcher: 'aredl',
        pool: [
          { name: 'Extended Slot A', rank: 76 },
          { name: 'Extended Slot B', rank: 84 },
          { name: 'Extended Slot C', rank: 97 },
          { name: 'Extended Slot D', rank: 112 },
          { name: 'Extended Slot E', rank: 129 },
          { name: 'Extended Slot F', rank: 150 },
        ],
      },
      {
        id: 'top10',
        label: 'Top10',
        meta: 'AREDL 1~10',
        endpoint: 'https://aredl.net/?showToast=authRequired',
        fetcher: 'aredl',
        pool: [
          { name: 'Arcturus', rank: 1 },
          { name: 'Tidal Wave', rank: 2 },
          { name: 'Kyouki', rank: 3 },
          { name: 'Acheron', rank: 4 },
          { name: 'Tartarus', rank: 5 },
          { name: 'Bloodlust', rank: 10 },
        ],
      },
    ];

    const modeButtons = document.getElementById('modeButtons');
    const mapList = document.getElementById('mapList');
    const dropTrack = document.getElementById('dropTrack');
    const statusText = document.getElementById('statusText');
    const selectedMode = document.getElementById('selectedMode');
    const selectedMeta = document.getElementById('selectedMeta');
    const resultName = document.getElementById('resultName');
    const resultMeta = document.getElementById('resultMeta');
    const spinBtn = document.getElementById('spinBtn');
    const turboBtn = document.getElementById('turboBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dropWindow = document.getElementById('dropWindow');

    let activeMode = modes[0];
    let spinning = false;
    let trackOffset = 0;
    let loadedPools = new Map();
    let rafId = null;
    let targetOffset = 0;
    let currentSpeed = 0;

    function fallbackPool(mode) {
      return mode.pool.slice();
    }

    async function fetchPool(mode) {
      if (loadedPools.has(mode.id)) return loadedPools.get(mode.id);
      let pool = null;
      try {
        const res = await fetch(mode.endpoint, { mode: 'cors' });
        const text = await res.text();
        if (mode.fetcher === 'aredl') {
          const hits = [...text.matchAll(/#\s*(\d+)\s*-\s*([^<\n]+)|#\s*(\d+)\s*([^\n<]+)/g)]
            .map(m => ({ rank: Number(m[1] || m[3]), name: (m[2] || m[4] || '').trim() }))
            .filter(x => x.rank && x.name);
          if (hits.length) pool = hits;
        } else {
          const hits = [...text.matchAll(/#\s*(\d+)\s*\|\s*([^\n<|]+)/g)]
            .map(m => ({ rank: Number(m[1]), name: m[2].trim() }))
            .filter(x => x.rank && x.name);
          if (hits.length) pool = hits;
        }
      } catch {
        pool = null;
      }
      const finalPool = pool && pool.length ? pool : fallbackPool(mode);
      loadedPools.set(mode.id, finalPool);
      return finalPool;
    }

    function renderButtons() {
      modeButtons.innerHTML = '';
      modes.forEach(mode => {
        const btn = document.createElement('button');
        btn.className = `chip ${mode.id === activeMode.id ? 'active' : ''}`;
        btn.textContent = mode.label;
        btn.addEventListener('click', async () => {
          if (spinning) return;
          activeMode = mode;
          selectedMode.textContent = mode.label;
          selectedMeta.textContent = mode.meta;
          resultName.textContent = '-';
          resultMeta.textContent = '룰렛을 돌리면 여기에 결과가 나옵니다.';
          statusText.textContent = 'LOADED';
          renderButtons();
          await renderList();
          await buildTrack(mode);
        });
        modeButtons.appendChild(btn);
      });
    }

    async function renderList() {
      const pool = await fetchPool(activeMode);
      mapList.innerHTML = '';
      pool.slice().sort((a, b) => a.rank - b.rank).forEach(item => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div class="rank">#${item.rank}</div>
          <div class="mapname">${item.name}</div>
          <div class="mode">${activeMode.id}</div>
        `;
        mapList.appendChild(row);
      });
    }

    async function buildTrack(mode) {
      const pool = await fetchPool(mode);
      const sequence = [];
      for (let i = 0; i < 26; i += 1) {
        sequence.push(pool[i % pool.length]);
      }
      dropTrack.innerHTML = sequence.map(item => `
        <div class="map-card">
          ${item.name}
          <small>#${item.rank} · ${mode.label}</small>
        </div>
      `).join('');
      trackOffset = 0;
      dropTrack.style.transform = 'translateY(0)';
    }

    function animateDrop(duration) {
      const start = performance.now();
      const startOffset = trackOffset;
      const delta = targetOffset - startOffset;
      const easeOut = t => 1 - Math.pow(1 - t, 4);

      const step = now => {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / duration);
        const eased = easeOut(t);
        const offset = startOffset + delta * eased;
        dropTrack.style.transform = `translateY(${offset}px)`;
        if (t < 1) {
          rafId = requestAnimationFrame(step);
        } else {
          trackOffset = targetOffset;
        }
      };

      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(step);
    }

    async function spin(multiplier = 1) {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      turboBtn.disabled = true;
      dropWindow.classList.add('spin');
      statusText.textContent = 'SPINNING';
      resultName.textContent = '-';
      resultMeta.textContent = '룰렛이 아래로 떨어지는 중...';

      const mode = activeMode;
      const pool = await fetchPool(mode);
      const choice = pool[Math.floor(Math.random() * pool.length)];
      const duration = 1100 + Math.round(420 * multiplier);
      const travel = 1180 + Math.random() * 820 * multiplier;
      targetOffset = trackOffset + travel;
      await buildTrack(mode);
      animateDrop(duration);

      setTimeout(() => {
        spinning = false;
        spinBtn.disabled = false;
        turboBtn.disabled = false;
        dropWindow.classList.remove('spin');
        statusText.textContent = 'READY';
        resultName.textContent = choice.name;
        resultMeta.textContent = `#${choice.rank} · ${mode.label} · ${mode.meta}`;
      }, duration);
    }

    async function reset() {
      if (spinning) return;
      statusText.textContent = 'READY';
      resultName.textContent = '-';
      resultMeta.textContent = '룰렛을 돌리면 여기에 결과가 나옵니다.';
      trackOffset = 0;
      targetOffset = 0;
      if (rafId) cancelAnimationFrame(rafId);
      await buildTrack(activeMode);
    }

    spinBtn.addEventListener('click', () => spin(1));
    turboBtn.addEventListener('click', () => spin(1.8));
    resetBtn.addEventListener('click', reset);

    (async () => {
      selectedMode.textContent = activeMode.label;
      selectedMeta.textContent = activeMode.meta;
      renderButtons();
      await renderList();
      await buildTrack(activeMode);
    })();
  </script>
</body>
</html>
