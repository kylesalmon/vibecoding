<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geometry Dash Map Roulette</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(11, 16, 28, 0.86);
      --panel-2: rgba(17, 24, 39, 0.95);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #fbbf24;
      --pink: #ff385c;
      --cyan: #38bdf8;
      --green: #34d399;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 56, 92, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 26%),
        linear-gradient(160deg, #050816, #0d1324 55%, #070b14);
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(1200px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(255, 56, 92, 0.12), transparent 35%),
        linear-gradient(225deg, rgba(56, 189, 248, 0.10), transparent 32%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 840px;
    }

    .content {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 18px;
      padding: 18px;
    }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 9999px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: transform 120ms ease, background 120ms ease;
    }

    .chip:hover { transform: translateY(-1px); background: rgba(255,255,255,0.08); }
    .chip.active {
      border-color: rgba(255, 56, 92, 0.55);
      background: rgba(255, 56, 92, 0.16);
    }

    .spin-row {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr 170px;
      align-items: center;
      margin-bottom: 16px;
    }

    .display {
      min-height: 150px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(0,0,0,0.24);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      padding: 18px;
    }

    .display::before,
    .display::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251,191,36,0.18), transparent 65%);
      filter: blur(10px);
      pointer-events: none;
    }
    .display::before { top: -140px; left: -100px; }
    .display::after { right: -120px; bottom: -160px; background: radial-gradient(circle, rgba(255,56,92,0.18), transparent 65%); }

    .roulette {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      display: grid;
      gap: 12px;
    }

    .band {
      height: 86px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03)),
        rgba(3, 7, 18, 0.78);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .band-track {
      display: flex;
      gap: 16px;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      transform: translateX(0);
    }

    .map-pill {
      min-width: 200px;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,56,92,0.95), rgba(251,191,36,0.92));
      color: #111827;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(0,0,0,0.24);
      text-align: center;
    }

    .map-pill small {
      display: block;
      margin-top: 4px;
      font-weight: 700;
      opacity: 0.92;
    }

    .winner {
      margin-top: 4px;
      text-align: center;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .result {
      display: grid;
      gap: 14px;
    }

    .result-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      padding: 16px;
    }

    .result-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .result-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
    }

    .result-meta {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.55;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 9999px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #111827;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      box-shadow: 0 12px 26px rgba(245, 158, 11, 0.22);
    }

    button.secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: 460px;
      overflow: auto;
      padding-right: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 88px 1fr 64px;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
    }

    .rank {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
    }

    .mapname {
      color: var(--text);
      font-weight: 700;
    }

    .mode {
      text-align: right;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .flash {
      animation: flash 1s ease-in-out infinite;
    }

    @keyframes flash {
      0%, 100% { filter: saturate(1); transform: scale(1); }
      50% { filter: saturate(1.35) brightness(1.08); transform: scale(1.01); }
    }

    @media (max-width: 940px) {
      .content { grid-template-columns: 1fr; }
      .spin-row { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .mode { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Geometry Dash Map Roulette</h1>
      <p class="subtitle">
        AREDL 구간을 기반으로 이지데몬, 미데, 하데, 익데, 레거시, 익텐, Top10 중 하나를 고른 뒤 잭팟처럼 돌아가는 룰렛을 멈춰 맵을 뽑습니다.
        Legacy는 150등 이하, ExTended는 76~150, Main은 1~75를 뜻합니다.
      </p>
    </section>

    <section class="content">
      <div class="card">
        <h2 class="section-title">룰렛</h2>
        <div class="controls" id="modeButtons"></div>

        <div class="spin-row">
          <div class="display flash" id="display">
            <div class="roulette">
              <div class="band">
                <div class="band-track" id="bandTrack"></div>
              </div>
              <div class="winner" id="winnerText">버튼을 눌러 룰렛을 돌려보세요.</div>
            </div>
          </div>
          <div>
            <div class="result-box">
              <div class="result-label">선택된 구간</div>
              <div class="result-name" id="selectedMode">이지데몬</div>
              <div class="result-meta" id="selectedMeta">AREDL 기준으로 해당 구간의 맵들만 룰렛에 들어갑니다.</div>
            </div>
            <div class="button-row">
              <button id="spinBtn" type="button">SPIN</button>
              <button id="hardSpinBtn" class="secondary" type="button">HYPER SPIN</button>
              <button id="resetBtn" class="secondary" type="button">리셋</button>
            </div>
          </div>
        </div>

        <div class="result-box">
          <div class="result-label">당첨 맵</div>
          <div class="result-name" id="resultName">-</div>
          <div class="result-meta" id="resultMeta">설정한 구간의 랜덤 맵이 여기에 표시됩니다.</div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">맵 풀</h2>
        <div class="list" id="mapList"></div>
      </div>
    </section>
  </main>

  <script>
    const modes = [
      {
        id: 'easy',
        label: '이지데몬',
        meta: '쉬운 쪽의 Extreme Demon 구간',
        pool: [
          { name: 'Bloodlust', rank: 1 },
          { name: 'Sakupen Circles', rank: 2 },
          { name: 'Kocmoc', rank: 5 },
          { name: 'Avernus', rank: 8 },
          { name: 'Firework', rank: 12 },
          { name: 'Slaughterhouse', rank: 15 },
        ],
      },
      {
        id: 'mid',
        label: '미데',
        meta: '중간 난이도 Extreme Demon 구간',
        pool: [
          { name: 'Digital Descent', rank: 24 },
          { name: 'The Golden', rank: 31 },
          { name: 'Tartarus', rank: 39 },
          { name: 'Edge of Destiny', rank: 47 },
          { name: 'Acheron', rank: 52 },
          { name: 'Acu', rank: 58 },
        ],
      },
      {
        id: 'hard',
        label: '하데',
        meta: '어려운 Extreme Demon 구간',
        pool: [
          { name: 'Spectrum Cyclone', rank: 64 },
          { name: 'Kyouki', rank: 71 },
          { name: 'Athanatos', rank: 88 },
          { name: 'Nhelv', rank: 102 },
          { name: 'Cognition', rank: 121 },
          { name: 'Rust', rank: 138 },
        ],
      },
      {
        id: 'exo',
        label: '익데',
        meta: 'Extreme Demon 전체 구간',
        pool: [
          { name: 'Arcturus', rank: 1 },
          { name: 'Acheron', rank: 52 },
          { name: 'Kyouki', rank: 71 },
          { name: 'Spectre', rank: 110 },
          { name: 'The Hallucination', rank: 148 },
          { name: 'Tidal Wave', rank: 4 },
        ],
      },
      {
        id: 'legacy',
        label: '레거시',
        meta: 'AREDL 150등 이하',
        pool: [
          { name: 'Legacy Slot A', rank: 149 },
          { name: 'Legacy Slot B', rank: 143 },
          { name: 'Legacy Slot C', rank: 132 },
          { name: 'Legacy Slot D', rank: 117 },
          { name: 'Legacy Slot E', rank: 98 },
          { name: 'Legacy Slot F', rank: 151 },
        ],
      },
      {
        id: 'extended',
        label: '익텐',
        meta: 'AREDL 76~150',
        pool: [
          { name: 'Extended Slot A', rank: 76 },
          { name: 'Extended Slot B', rank: 84 },
          { name: 'Extended Slot C', rank: 97 },
          { name: 'Extended Slot D', rank: 112 },
          { name: 'Extended Slot E', rank: 129 },
          { name: 'Extended Slot F', rank: 150 },
        ],
      },
      {
        id: 'top10',
        label: 'Top10',
        meta: 'AREDL 1~10',
        pool: [
          { name: 'Arcturus', rank: 1 },
          { name: 'Tidal Wave', rank: 2 },
          { name: 'Kyouki', rank: 3 },
          { name: 'Acheron', rank: 4 },
          { name: 'Tartarus', rank: 5 },
          { name: 'Bloodlust', rank: 10 },
        ],
      },
    ];

    const modeButtons = document.getElementById('modeButtons');
    const mapList = document.getElementById('mapList');
    const bandTrack = document.getElementById('bandTrack');
    const winnerText = document.getElementById('winnerText');
    const selectedMode = document.getElementById('selectedMode');
    const selectedMeta = document.getElementById('selectedMeta');
    const resultName = document.getElementById('resultName');
    const resultMeta = document.getElementById('resultMeta');
    const spinBtn = document.getElementById('spinBtn');
    const hardSpinBtn = document.getElementById('hardSpinBtn');
    const resetBtn = document.getElementById('resetBtn');

    let activeMode = modes[0];
    let spinning = false;
    let spinTimer = null;

    function renderButtons() {
      modeButtons.innerHTML = '';
      modes.forEach(mode => {
        const btn = document.createElement('button');
        btn.className = `chip ${mode.id === activeMode.id ? 'active' : ''}`;
        btn.textContent = mode.label;
        btn.addEventListener('click', () => {
          if (spinning) return;
          activeMode = mode;
          renderButtons();
          renderList();
          selectedMode.textContent = mode.label;
          selectedMeta.textContent = mode.meta;
          resultMeta.textContent = '설정한 구간의 랜덤 맵이 여기에 표시됩니다.';
          resultName.textContent = '-';
          winnerText.textContent = '버튼을 눌러 룰렛을 돌려보세요.';
        });
        modeButtons.appendChild(btn);
      });
    }

    function renderList() {
      mapList.innerHTML = '';
      activeMode.pool
        .slice()
        .sort((a, b) => a.rank - b.rank)
        .forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `
            <div class="rank">#${item.rank}</div>
            <div class="mapname">${item.name}</div>
            <div class="mode">${index === 0 ? 'main' : activeMode.id}</div>
          `;
          mapList.appendChild(row);
        });
    }

    function buildTrack(mode) {
      const sequence = [];
      for (let i = 0; i < 18; i += 1) {
        sequence.push(mode.pool[i % mode.pool.length]);
      }
      bandTrack.innerHTML = sequence.map(item => `
        <div class="map-pill">
          ${item.name}
          <small>#${item.rank} ${mode.label}</small>
        </div>
      `).join('');
      bandTrack.style.transform = 'translateX(0)';
    }

    function spin(multiplier = 1) {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      hardSpinBtn.disabled = true;
      resultName.textContent = '-';
      resultMeta.textContent = '룰렛이 돌아가는 중...';
      winnerText.textContent = '또로로로록...';
      winnerText.classList.add('flash');

      const mode = activeMode;
      const choice = mode.pool[Math.floor(Math.random() * mode.pool.length)];
      const distance = -(1200 + Math.random() * 900 * multiplier);
      const duration = 2400 + Math.round(700 * multiplier);

      buildTrack(mode);
      bandTrack.style.transition = 'transform ' + duration + 'ms cubic-bezier(0.12, 0.72, 0.08, 1)';
      requestAnimationFrame(() => {
        bandTrack.style.transform = 'translateX(' + distance + 'px)';
      });

      clearTimeout(spinTimer);
      spinTimer = setTimeout(() => {
        spinning = false;
        spinBtn.disabled = false;
        hardSpinBtn.disabled = false;
        winnerText.classList.remove('flash');
        const clean = mode.pool.find(item => item.name === choice.name) || choice;
        resultName.textContent = clean.name;
        resultMeta.textContent = `#${clean.rank} · ${mode.label} · ${mode.meta}`;
        winnerText.textContent = `당첨 맵: ${clean.name}`;
      }, duration);
    }

    function reset() {
      if (spinning) return;
      resultName.textContent = '-';
      resultMeta.textContent = '설정한 구간의 랜덤 맵이 여기에 표시됩니다.';
      winnerText.textContent = '버튼을 눌러 룰렛을 돌려보세요.';
      bandTrack.style.transition = 'none';
      bandTrack.style.transform = 'translateX(0)';
    }

    spinBtn.addEventListener('click', () => spin(1));
    hardSpinBtn.addEventListener('click', () => spin(1.7));
    resetBtn.addEventListener('click', reset);

    selectedMode.textContent = activeMode.label;
    selectedMeta.textContent = activeMode.meta;
    renderButtons();
    renderList();
    buildTrack(activeMode);
  </script>
</body>
</html>
